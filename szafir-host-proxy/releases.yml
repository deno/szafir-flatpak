releases:
  - version: 0.5.3
    date: 2026-08-02
    description:
      en: >-
        Improved Polish localization with a reproducible translation catalog,
        placeholder checks, and CI validation. Refreshed AppStream metadata
        and verified translation packaging.
      pl: >-
        Ulepszono polską lokalizację dzięki reprodukowalnemu katalogowi
        tłumaczeń, kontroli placeholderów i walidacji CI. Odświeżono metadane
        AppStream oraz zweryfikowano pakowanie tłumaczeń.
  - version: 0.5.2
    date: 2026-08-01
    description:
      en: >-
        Cosmetic fixes.
      pl: >-
        Poprawki kosmetyczne.
  - version: 0.5.1
    date: 2026-08-01
    description:
      en: >-
        Documentation and packaging improvements.
      pl: >-
        Ulepszenia dokumentacji i pakowania.
  - version: 0.5.0
    date: 2026-08-01
    description:
      en: >-
        Added a dark mode.
      pl: >-
        Dodano tryb ciemny.
  - version: 0.4.0
    date: 2026-08-01
    description:
      en: >-
        The proxy can now see your smart card. The status page shows whether a
        card is inserted, updating live as you plug and remove it. A new details
        page lists your card's readers, tokens, and certificates — tap a
        certificate to inspect it. The app verifies the card provider's integrity
        before use and re-checks it if the file changes. Also fixes RPM
        installation on current Fedora and desktop registration so portal
        prompts (file picker, etc.) work correctly.
      pl: >-
        Proxy widzi teraz twoją kartę kryptograficzną. Strona stanu pokazuje na
        bieżąco, czy karta jest włożona, i reaguje na jej włożenie lub wyjęcie.
        Nowa strona szczegółów wyświetla czytniki, tokeny i certyfikaty karty —
        dotknij certyfikatu, aby go obejrzeć. Aplikacja weryfikuje integralność
        dostawcy karty przed użyciem i ponawia weryfikację po jego zmianie.
        Poprawiono także instalację RPM na aktualnej Fedorze oraz rejestrację
        w środowisku, dzięki czemu działają okna portalu (wybór plików itp.).
  - version: 0.3.2
    date: 2026-07-27
    description:
      en: >-
        Switch pcsc-lite 2.3.3 download URL to Fedora lookaside mirror;
        upstream removed older releases from their site, breaking CI builds.
      pl: >-
        Zmieniono adres pobierania pcsc-lite 2.3.3 na mirror Fedora;
        upstream usunął starsze wydania ze swojej strony, co psuło budowanie CI.
  - version: 0.3.1
    date: 2026-07-27
    description:
      en: >-
        Revert pcsc-lite to 2.3.3 for Flatpak version for broader
        compatibility.
      pl: >-
        Przywrócono pcsc-lite do wersji 2.3.3 w wersji Flatpak dla
        szerszej kompatybilności.
  - version: 0.3.0
    date: 2026-07-27
    description:
      en: >-
        Packaging support now includes Nix and RPM definitions. Bubblewrap is
        used as a sandboxing mechanism when running outside of Flatpak.
        SzafirHost runtime and components are automatically updated, eliminating
        the need for manual version management. The bundled pcsc-lite was
        upgraded from 2.3.3 to 2.5.1.
      pl: >-
        Dodano definicje Nix oraz RPM. Przy uruchamianiu poza środowiskiem
        Flatpak, funkcję sandboxa pełni Bubblewrap. Runtime i komponenty
        SzafirHost aktualizują się automatycznie, co eliminuje konieczność
        ręcznego zarządzania wersjami. Dołączony pcsc-lite został
        zaktualizowany z wersji 2.3.3 do 2.5.1.
  - version: 0.2.5
    date: 2026-04-28
    description:
      en: Update to new version of SzafirHost (1.2.2)
      pl: Zaktualizuj do nowej wersji SzafirHost (1.2.2)
  - version: 0.2.4
    date: 2026-04-28
    description:
      en: Update to new version of SzafirHost (1.2.1)
      pl: Zaktualizuj do nowej wersji SzafirHost (1.2.1)
  - version: 0.2.3
    date: 2026-04-07
    description:
      en: "fixed: Landlock launcher sandbox was too restrictive"
      pl: "naprawiono: Zabezpieczenia launchera były zbyt restryktywne"
  - version: 0.2.2
    date: 2026-04-05
    description:
      en: Added animations to the status page.
      pl: Dodano animacje do strony statusu.
  - version: 0.2.1
    date: 2026-04-04
    description:
      en: Bug fixes and README updates.
      pl: Poprawki błędów i aktualizacja README.
  - version: 0.2.0
    date: 2026-04-01
    description:
      en: Metadata refresh for the GitHub-hosted Flatpak repository release.
      pl: Odświeżenie metadanych dla wydania repozytorium Flatpak hostowanego na GitHubie.
