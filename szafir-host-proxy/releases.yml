releases:
  - version: 0.3.0
    date: 2026-07-27
    description:
      en: >-
        Packaging support now includes Nix and RPM definitions. Bubblewrap is
        used as a sandboxing mechanism when running outside of Flatpak.
        SzafirHost runtime and components are automatically updated, eliminating
        the need for manual version management. The bundled pcsc-lite was
        upgraded from 2.3.3 to 2.5.1.
      pl: >-
        Dodano definicje Nix oraz RPM. Przy uruchamianiu poza środowiskiem
        Flatpak, funkcję sandboxa pełni Bubblewrap. Runtime i komponenty
        SzafirHost aktualizują się automatycznie, co eliminuje konieczność
        ręcznego zarządzania wersjami. Dołączony pcsc-lite został
        zaktualizowany z wersji 2.3.3 do 2.5.1.
  - version: 0.2.5
    date: 2026-04-28
    description:
      en: Update to new version of SzafirHost (1.2.2)
      pl: Zaktualizuj do nowej wersji SzafirHost (1.2.2)
  - version: 0.2.4
    date: 2026-04-28
    description:
      en: Update to new version of SzafirHost (1.2.1)
      pl: Zaktualizuj do nowej wersji SzafirHost (1.2.1)
  - version: 0.2.3
    date: 2026-04-07
    description:
      en: "fixed: Landlock launcher sandbox was too restrictive"
      pl: "naprawiono: Zabezpieczenia launchera były zbyt restryktywne"
  - version: 0.2.2
    date: 2026-04-05
    description:
      en: Added animations to the status page.
      pl: Dodano animacje do strony statusu.
  - version: 0.2.1
    date: 2026-04-04
    description:
      en: Bug fixes and README updates.
      pl: Poprawki błędów i aktualizacja README.
  - version: 0.2.0
    date: 2026-04-01
    description:
      en: Metadata refresh for the GitHub-hosted Flatpak repository release.
      pl: Odświeżenie metadanych dla wydania repozytorium Flatpak hostowanego na GitHubie.